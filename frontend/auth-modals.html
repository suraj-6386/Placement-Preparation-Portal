<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-4">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="loginModalLabel">Welcome Back</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body px-4 pt-3 pb-4">
        <p class="text-muted small mb-4">Sign in to your SkillPrep Portal account</p>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input
              type="text"
              class="form-control form-control-lg fs-6 rounded-3"
              id="loginUsername"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input
              type="password"
              class="form-control form-control-lg fs-6 rounded-3"
              id="loginPassword"
              placeholder="Enter your password"
              required
            />
          </div>
          <div id="loginError" class="alert alert-danger py-2 small d-none"></div>
          <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold shadow-sm mb-3">Sign In</button>
        </form>

        <div class="auth-divider my-3 d-flex align-items-center">
          <div class="flex-grow-1 border-top"></div>
          <span class="px-3 text-muted small fw-semibold">OR</span>
          <div class="flex-grow-1 border-top"></div>
        </div>

        <!-- Google Sign-In Container -->
        <div id="googleSignInBtn" class="d-flex justify-content-center">
          <a href="/auth/google/login" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 google-btn shadow-sm py-2 text-decoration-none">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
              <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span class="fw-medium">Continue with Google</span>
          </a>
        </div>

        <div class="text-center mt-4">
          <span class="text-muted small">Don't have an account?</span>
          <a href="#" class="small fw-semibold text-primary ms-1" data-bs-toggle="modal" data-bs-target="#registerModal" data-bs-dismiss="modal">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-4">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="registerModalLabel">Create Account</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body px-4 pt-3 pb-4">
        <p class="text-muted small mb-4">Start your placement preparation journey</p>
        <form id="registerForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Full Name *</label>
              <input type="text" class="form-control rounded-3" id="regName" placeholder="e.g. John Doe" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email Address *</label>
              <input type="email" class="form-control rounded-3" id="regEmail" placeholder="john@example.com" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Username *</label>
              <input
                type="text"
                class="form-control rounded-3"
                id="regUsername"
                placeholder="Choose a username"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Password *</label>
              <input
                type="password"
                class="form-control rounded-3"
                id="regPassword"
                placeholder="Create a strong password"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Phone Number</label>
              <input type="tel" class="form-control rounded-3" id="regPhone" placeholder="e.g. 9876543210" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">College / University</label>
              <input type="text" class="form-control rounded-3" id="regCollege" placeholder="e.g. National Institute" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Degree / Course</label>
              <input type="text" class="form-control rounded-3" id="regCourse" placeholder="e.g. B.Tech Computer Science" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Skills (comma separated)</label>
              <input type="text" class="form-control rounded-3" id="regSkills" placeholder="e.g. Python, SQL, Java" />
            </div>
          </div>
          <div id="registerError" class="alert alert-danger py-2 small d-none mt-3"></div>
          <div id="registerSuccess" class="alert alert-success py-2 small d-none mt-3"></div>
          <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold shadow-sm mt-4 mb-3">Register Account</button>
        </form>

        <div class="auth-divider my-3 d-flex align-items-center">
          <div class="flex-grow-1 border-top"></div>
          <span class="px-3 text-muted small fw-semibold">OR</span>
          <div class="flex-grow-1 border-top"></div>
        </div>

        <!-- Google Sign-Up Container -->
        <div id="googleSignUpBtn" class="d-flex justify-content-center">
          <a href="/auth/google/login" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 google-btn shadow-sm py-2 text-decoration-none">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
              <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span class="fw-medium">Sign up with Google</span>
          </a>
        </div>

        <div class="text-center mt-3">
          <span class="text-muted small">Already have an account?</span>
          <a href="#" class="small fw-semibold text-primary ms-1" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-dismiss="modal">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
