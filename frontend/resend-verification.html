<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resend Verification - Placement Preparation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css?v=20260905" />
    <link rel="stylesheet" href="assets/css/password-reset.css?v=20260915" />
  </head>
  <body class="password-page">
    <main class="password-shell">
      <section class="password-card">
        <a class="password-brand" href="/">Placement Preparation Portal</a>
        <span class="password-kicker">Email verification</span>
        <h1>Resend verification email</h1>
        <p class="password-copy">Enter your email address and we will send a new verification link if needed.</p>
        <form id="resendVerificationForm" novalidate>
          <label for="verificationEmail" class="form-label">Email address</label>
          <input id="verificationEmail" type="email" class="form-control form-control-lg" autocomplete="email" required />
          <div id="verificationError" class="alert alert-danger py-2 small d-none mt-3" role="alert"></div>
          <div id="verificationSuccess" class="alert alert-success py-2 small d-none mt-3" role="status"></div>
          <button id="verificationSubmit" type="submit" class="btn btn-primary btn-lg w-100 mt-3">Send verification email</button>
        </form>
        <a href="/" class="password-back">Back to sign in</a>
      </section>
    </main>
    <script src="assets/js/password-reset.js?v=20260915"></script>
  </body>
</html>
