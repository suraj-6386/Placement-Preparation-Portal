<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - SkillPrep Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css?v=20260905" />
    <link rel="stylesheet" href="assets/css/password-reset.css?v=20260915" />
  </head>
  <body class="password-page">
    <main class="password-shell">
      <section class="password-card">
        <a class="password-brand" href="/">SkillPrep Portal</a>
        <span class="password-kicker">Account recovery</span>
        <h1>Forgot your password?</h1>
        <p class="password-copy">Enter your account email and we will send a secure reset link.</p>
        <form id="forgotPasswordForm" novalidate>
          <label for="forgotEmail" class="form-label">Email address</label>
          <input id="forgotEmail" name="email" type="email" class="form-control form-control-lg" autocomplete="email" required />
          <div id="forgotError" class="alert alert-danger py-2 small d-none mt-3" role="alert"></div>
          <div id="forgotSuccess" class="alert alert-success py-2 small d-none mt-3" role="status"></div>
          <button id="forgotSubmit" type="submit" class="btn btn-primary btn-lg w-100 mt-3">Send reset link</button>
        </form>
        <a href="/" class="password-back">Back to sign in</a>
      </section>
    </main>
    <script src="assets/js/password-reset.js?v=20260915"></script>
  </body>
</html>
