<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aptitude - Placement Preparation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/practice-tab.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Placement Preparation Portal</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item">
              <a class="nav-link active" href="aptitude.html">Aptitude</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="coding.html">Coding</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="interview.html">Interview</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="help.html">Help</a>
            </li>
            <li class="nav-item">
              <button
                class="btn nav-link theme-toggle"
                id="themeToggle"
                onclick="toggleTheme()"
                title="Toggle Dark/Light Mode"
              >
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
              </button>
            </li>
            <li class="nav-item" id="authNav"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="mb-4">Aptitude Preparation</h2>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-4" id="aptitudeTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="learn-tab"
            data-bs-toggle="tab"
            data-bs-target="#learn"
            type="button"
          >
            Learn
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="practice-tab"
            data-bs-toggle="tab"
            data-bs-target="#practice"
            type="button"
          >
            Practice
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="mock-tab"
            data-bs-toggle="tab"
            data-bs-target="#mock"
            type="button"
          >
            Mock Test
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="aptitudeTabContent">
        <!-- Learn Tab -->
        <div class="tab-pane fade show active" id="learn" role="tabpanel">
          <h4 class="mb-3">Learning Resources</h4>
          <div id="learnContent" class="row"></div>
        </div>

        <!-- Practice Tab -->
        <div class="tab-pane fade" id="practice" role="tabpanel">
          <!-- Chapter Cards View -->
          <div id="chapterCardsView">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="mb-0">Choose a Chapter</h4>
              <span
                id="totalChaptersCount"
                class="badge bg-primary fs-6"
              ></span>
            </div>
            <div id="practiceChapters" class="row g-4"></div>
          </div>

          <!-- Chapter Details View -->
          <div id="chapterDetailsView" style="display: none">
            <div class="chapter-header mb-4">
              <button
                class="btn btn-outline-primary btn-sm mb-3"
                onclick="backToChapters()"
                aria-label="Back to chapters"
              >
                <i>←</i> Back to Chapters
              </button>
              <div
                class="d-flex justify-content-between align-items-center flex-wrap gap-3"
              >
                <div>
                  <h4 id="chapterTitle" class="mb-1"></h4>
                  <p id="chapterStats" class="text-muted mb-0"></p>
                </div>
                <div class="d-flex gap-2 align-items-center flex-wrap">
                  <select
                    id="difficultyFilter"
                    class="form-select form-select-sm"
                    style="width: auto"
                    aria-label="Filter by difficulty"
                  >
                    <option value="">All Difficulties</option>
                    <option value="easy">Easy</option>
                    <option value="moderate">Moderate</option>
                    <option value="hard">Hard</option>
                  </select>
                  <input
                    type="search"
                    id="questionSearch"
                    class="form-control form-control-sm"
                    placeholder="Search questions..."
                    style="width: 250px"
                    aria-label="Search questions"
                  />
                </div>
              </div>
            </div>

            <div id="questionStats" class="alert alert-info mb-4"></div>

            <!-- Question List -->
            <div id="questionList" class="question-list-container mb-4"></div>

            <!-- Pagination -->
            <nav aria-label="Question pagination">
              <ul
                id="pagination"
                class="pagination justify-content-center"
              ></ul>
            </nav>
          </div>
        </div>

        <!-- Mock Test Tab -->
        <div class="tab-pane fade" id="mock" role="tabpanel">
          <h4 class="mb-3">Mock Tests</h4>
          <div id="mockSelection">
            <p class="mb-3">Select difficulty level:</p>
            <button
              class="btn btn-success me-2"
              onclick="startMockTest('easy')"
            >
              Easy
            </button>
            <button
              class="btn btn-warning me-2"
              onclick="startMockTest('medium')"
            >
              Medium
            </button>
            <button class="btn btn-danger" onclick="startMockTest('hard')">
              Hard
            </button>
          </div>
          <div id="mockTest" style="display: none"></div>
          <div id="mockResult" style="display: none"></div>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
      <p class="mb-0">
        &copy; 2024 Placement Preparation Portal. All rights reserved.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/practice-tab.js"></script>
    <script>
      // Load auth modals and check authentication
      loadAuthModals();
      checkAuth();

      // Load Learn and Practice data
      async function loadAptitudeData() {
        // Load Learn data
        const learnData = await fetchAPI("/api/aptitude/learn");
        const learnContent = document.getElementById("learnContent");
        learnContent.innerHTML = "";
        for (const [chapter, url] of Object.entries(learnData)) {
          learnContent.innerHTML += `
            <div class="col-md-6 col-lg-4 mb-3">
              <div class="card h-100">
                <div class="card-body">
                  <h5 class="card-title">${chapter}</h5>
                  <a href="${url}" target="_blank" class="btn btn-primary btn-sm">Learn More</a>
                </div>
              </div>
            </div>
          `;
        }

        // Load Practice data using the new practice-tab.js module
        loadPracticeData();
      }

      loadAptitudeData();

      // Mock Test State
      let currentMockQuestions = [];
      let currentAnswers = [];

      async function startMockTest(level) {
        const mockData = await fetchAPI("/api/aptitude/mock");
        const sets = mockData[level]?.sets || [];
        if (sets.length === 0) {
          alert("No mock tests available for this level");
          return;
        }

        const randomSet = sets[Math.floor(Math.random() * sets.length)];
        currentMockQuestions = randomSet;
        currentAnswers = new Array(randomSet.length).fill(null);

        document.getElementById("mockSelection").style.display = "none";
        document.getElementById("mockResult").style.display = "none";
        const mockTestDiv = document.getElementById("mockTest");
        mockTestDiv.style.display = "block";
        mockTestDiv.innerHTML = `<h5 class="mb-3">Mock Test - ${level.toUpperCase()}</h5>`;

        randomSet.forEach((q, idx) => {
          mockTestDiv.innerHTML += `
            <div class="card mb-3">
              <div class="card-body">
                <h6>Q${idx + 1}. ${q.question}</h6>
                ${q.options
                  .map(
                    (opt, i) => `
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="mock_${idx}" value="${opt}" onchange="saveMockAnswer(${idx}, '${opt}')">
                      <label class="form-check-label">${opt}</label>
                    </div>
                  `
                  )
                  .join("")}
              </div>
            </div>
          `;
        });

        mockTestDiv.innerHTML +=
          '<button class="btn btn-primary" onclick="submitMockTest()">Submit Test</button>';
      }

      function saveMockAnswer(idx, answer) {
        currentAnswers[idx] = answer;
      }

      function submitMockTest() {
        let correct = 0;
        currentMockQuestions.forEach((q, idx) => {
          if (currentAnswers[idx] === q.answer) correct++;
        });

        const total = currentMockQuestions.length;
        const percentage = ((correct / total) * 100).toFixed(2);

        document.getElementById("mockTest").style.display = "none";
        const resultDiv = document.getElementById("mockResult");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
          <div class="alert alert-info">
            <h4>Test Results</h4>
            <p><strong>Total Questions:</strong> ${total}</p>
            <p><strong>Correct Answers:</strong> ${correct}</p>
            <p><strong>Wrong Answers:</strong> ${total - correct}</p>
            <p><strong>Score:</strong> ${percentage}%</p>
          </div>
          <button class="btn btn-primary" onclick="location.reload()">Take Another Test</button>
        `;
      }
    </script>
  </body>
</html>
