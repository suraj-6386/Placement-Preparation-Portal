  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link

    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/style.css?v=20260905" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Placement Preparation Portal</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item">
              <a class="nav-link" href="aptitude.html">Aptitude</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="coding.html">Coding</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="interview.html">Interview</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="resume.html">Resume</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="help.html">Help</a>
            </li>
            <li class="nav-item">
              <button
                class="btn nav-link theme-toggle"
                id="themeToggle"
                onclick="toggleTheme()"
                title="Toggle Dark/Light Mode"
              >
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
              </button>
            </li>
            <li class="nav-item" id="authNav"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <!-- Back Button -->
      <div class="mb-4">
        <a href="interview.html" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Back to Interview
        </a>
      </div>

      <!-- Questions Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-2" id="subjectTitle">Loading...</h2>
          <p class="text-muted mb-0">
            <span id="questionCount">0</span> Interview Questions
          </p>
        </div>
        <div class="subject-icon" style="font-size: 3rem">📚</div>
      </div>

      <!-- Questions List -->
      <div id="questionsContainer" class="accordion"></div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
      <p class="mb-0">
        &copy; 2024 Placement Preparation Portal. All rights reserved.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js?v=20260905"></script>
    <style>
      .question-header {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        border: none;
        padding: 1rem 1.5rem;
        font-weight: 500;
        color: #2c3e50;
      }

      .accordion-button:not(.collapsed) {
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        color: white;
      }

      .accordion-button:focus {
        box-shadow: none;
        border-color: #4f46e5;
      }

      .accordion-item {
        border: 1px solid #e9ecef;
        margin-bottom: 0.5rem;
        border-radius: 8px;
        overflow: hidden;
      }

      .subject-icon {
        opacity: 0.7;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
    <script>
      // Load auth modals and check authentication
      loadAuthModals();
      checkAuth();

      // Get subject from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const subject = urlParams.get("subject");

      if (subject && typeof recordActivity === "function") {
        recordActivity("interview_viewed", "interview", subject);
      }

      if (!subject) {
        window.location.href = "interview.html";
      }

      // Subject icons mapping
      const subjectIcons = {
        C: "⚙️",
        "C++": "🔧",
        Java: "☕",
        Python: "🐍",
        JavaScript: "🟨",
        PHP: "🐘",
        "C#": "#️⃣",
        Go: "🔵",
        SQL: "🗄️",
        "HTML/CSS": "🎨",
        "Data Structures": "📊",
        DBMS: "💾",
        "Operating Systems": "🖥️",
        Networking: "🌐",
      };

      // Load and display questions
      async function loadTechnicalQuestions() {
        try {
          const response = await fetch("/api/interview/technical");
          const data = await response.json();

          if (data[subject]) {
            const questions = data[subject];

            // Update title and icon
            document.getElementById("subjectTitle").textContent = subject;
            document.getElementById("questionCount").textContent =
              questions.length;
            document.querySelector(".subject-icon").textContent =
              subjectIcons[subject] || "📚";

            // Display questions
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            questions.forEach((question, idx) => {
              container.innerHTML += `
                <div class="accordion-item">
                  <h2 class="accordion-header">
                    <button class="accordion-button collapsed question-header" type="button" data-bs-toggle="collapse" data-bs-target="#question${idx}">
                      <strong>${idx + 1}.</strong>&nbsp;${question}
                    </button>
                  </h2>
                  <div id="question${idx}" class="accordion-collapse collapse" data-bs-parent="#questionsContainer">
                    <div class="accordion-body">
                      <p class="text-muted mb-2"><i class="bi bi-lightbulb-fill text-warning"></i> <strong>Study Tips:</strong></p>
                      <ul class="mb-0">
                        <li>Study this concept thoroughly and be ready to explain it clearly</li>
                        <li>Prepare examples and use cases to demonstrate your understanding</li>
                        <li>Practice explaining the concept as if teaching someone else</li>
                        <li>Be ready to write code or draw diagrams if applicable</li>
                        <li>Research common follow-up questions on this topic</li>
                      </ul>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            window.location.href = "interview.html";
          }
        } catch (error) {
          console.error("Error loading questions:", error);
          document.getElementById("questionsContainer").innerHTML = `
            <div class="alert alert-danger">
              <i class="bi bi-exclamation-triangle"></i> Failed to load questions. Please try again.
            </div>
          `;
        }
      }

      // Load questions on page load
      loadTechnicalQuestions();
    </script>
  </body>
</html>
