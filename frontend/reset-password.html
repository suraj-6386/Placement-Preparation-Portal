<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Placement Preparation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css?v=20260905" />
    <link rel="stylesheet" href="assets/css/password-reset.css?v=20260915" />
  </head>
  <body class="password-page">
    <main class="password-shell">
      <section class="password-card">
        <a class="password-brand" href="/">Placement Preparation Portal</a>
        <span class="password-kicker">Create a new password</span>
        <h1>Reset your password</h1>
        <p class="password-copy">Choose a new password for your Placement Preparation Portal account.</p>
        <form id="resetPasswordForm" novalidate>
          <label for="newPassword" class="form-label">New password</label>
          <input id="newPassword" type="password" class="form-control form-control-lg" autocomplete="new-password" minlength="8" required />
          <div class="password-requirements">At least 8 characters, including uppercase, lowercase, number, and special character.</div>
          <label for="confirmPassword" class="form-label mt-3">Confirm password</label>
          <input id="confirmPassword" type="password" class="form-control form-control-lg" autocomplete="new-password" minlength="8" required />
          <div id="resetError" class="alert alert-danger py-2 small d-none mt-3" role="alert"></div>
          <div id="resetSuccess" class="alert alert-success py-2 small d-none mt-3" role="status"></div>
          <button id="resetSubmit" type="submit" class="btn btn-primary btn-lg w-100 mt-3">Update password</button>
        </form>
        <a href="/" class="password-back">Back to sign in</a>
      </section>
    </main>
    <script src="assets/js/password-reset.js?v=20260915"></script>
  </body>
</html>
